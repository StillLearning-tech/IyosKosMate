name: KosMate Microservices CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: docker compose config

      - name: Build Backend Docker Image
        run: docker build -t kosmate-backend:ci ./backend

      - name: Build Frontend Docker Image
        run: docker build -t kosmate-frontend:ci ./frontend
